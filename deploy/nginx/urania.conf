# urania.devya.dev on the Devya VPS: nginx serves the Next static export from
# /home/devya/projects/urania/current (a symlink to releases/<sha>, see
# scripts/deploy-vps.sh). No container, no Node: every page is a file.
# Installed by `bash scripts/deploy-vps.sh --setup`; certbot --nginx then adds
# the 443 server and the http -> https redirect (cert names urania.devya.dev and
# the pre-DNS check host urania.72-61-81-59.sslip.io).
server {
    listen 80;
    listen [::]:80;
    server_name urania.devya.dev urania.72-61-81-59.sslip.io;

    root /home/devya/projects/urania/current;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # "/" has no page of its own: the site starts at /en (the static export's
    # equivalent of the old next.config redirect). index.txt is the RSC payload
    # a client navigation to "/" asks for.
    location = / {
        return 307 /en;
    }
    location = /index.txt {
        return 307 /en.txt;
    }

    # Hashed build assets never change under the same name.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # /en -> en.html, /ar/chapters/royal -> ar/chapters/royal.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
